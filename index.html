<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=3.0" name="viewport" />
    <meta property="og:site_name" content="yuri.minkos.lol" />
    <meta property="og:title" content="yuri.minkos.lol" />
    <meta property="og:description" content="An infinite yuri scroller." />
    <meta content="https://yuri.minkos.lol" property="og:url">
    <title>yuri scroller</title>
</head>


<body>
    <center>
        <div id="content-before-loading">
            <h1>yuri!</h1>
            <p>images sourced from <a href="https://danbooru.donmai.us/">danbooru</a>!</p>
            <p>click on images to download fullres!!</p>
            <label for="column-slider">columns:</label>
            <input type="range" id="column-slider" min="1" max="20" value="1" />
            <hr>
        </div>
        <div id="content-before-loading" style="display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px;"></div>
        <p>loading...</p>
    </center>

    <script>
        const imageContainer = document.getElementById("content-before-loading");
        const columnSlider = document.getElementById("column-slider");
                    const new_img = document.createElement("div");
                    let new_img_url;
                    let format;
                    if (image["large_file_url"]) {
                        new_img_url = image.large_file_url.replace("cdn.donmai.us", "yuriproxy.minkos.lol");
                    } else {
                        new_img_url = image.file_url.replace("cdn.donmai.us", "yuriproxy.minkos.lol");
                    }
                    if (image.media_asset.duration) {
                        format = "video";
                    } else {
                        format = "img";
                    }
                    new_img.innerHTML = `<a href="${image.file_url}?download=1"><${format} src="${new_img_url}" style="max-width:100%;"></a><hr>`;
                    before_loading.appendChild(new_img);
        async function getInformation() {
            const result = await fetch("https://danbooru.donmai.us/posts.json?tags=yuri+rating:general+order:random&limit=10");
            const data = await result.json();

            data.forEach(image => {
                try {
                    const newImg = document.createElement("div");
                    let newImgUrl = image.large_file_url 
                        ? image.large_file_url.replace("cdn.donmai.us", "yuriproxy.minkos.lol") 
                        : image.file_url.replace("cdn.donmai.us", "yuriproxy.minkos.lol");

                    newImg.innerHTML = `<a href="${image.file_url}?download=1"><img src="${newImgUrl}" style="max-width:100%;"></a>`;
                    imageContainer.appendChild(newImg);
                } catch (e) {
                    console.error(e);
                }
            });

            loading = false;
        }

        window.addEventListener("scroll", async () => {
            if (document.documentElement.scrollTop + document.documentElement.clientHeight >= document.documentElement.scrollHeight - 3000 && !loading) {
                loading = true;
                await getInformation();
            }
        });

        getInformation();
    </script>
</body>
</html>
